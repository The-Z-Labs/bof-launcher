  desc: "path to the directory to be listed"
  type: string
  required: true
- name: test
  desc: "Type of test to conduct, supported: -type|-regex|-perm"
  type: string
  required: false
- name: test_param
  desc: "Parameter for selected test"
  type: string
  required: false
