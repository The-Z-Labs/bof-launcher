name: ShadowCreds-unPAC
srcfile: "shadowcreds"
description: "Shadow Credentials BOF - Complete Attack Chain"
author: RayRRT
Arch: ["x64", "x86"]
tags: ['windows', 'net-recon']
category: "ADCS-BOF"
OS: Windows
entrypoint: "go"
sources:
    - 'https://raw.githubusercontent.com/RayRRT/BOFs/refs/heads/main/ShadowCreds-unPAC-BOF/src/shadowcreds.c'
examples: |
 BOF performs complete attack chain:
 1. Generate RSA keypair and self-signed certificate with UPN/SID
 2. Build KeyCredential blob (msDS-KeyCredentialLink format)
 3. Write to target's msDS-KeyCredentialLink via LDAP
 4. PKINIT - Authenticate to KDC using the certificate
 5. UnPAC-the-hash - Extract NT hash from PAC credentials

 shadowcreds <target> <domain> [kdc]
 shadowcreds DC01$ corp.local dc01.corp.local
